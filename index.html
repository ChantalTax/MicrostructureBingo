<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microstructure Imaging Workshop — Networking Bingo</title>
<style>
  :root {
    --ink: #1a2332;
    --paper: #faf7f0;
    --accent: #7c3aed;
    --accent-dark: #5b21b6;
    --accent-light: #ede9fe;
    --line: #d8cfc0;
    --done: #10b981;
    --done-light: #d1fae5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: linear-gradient(160deg, #f3f0ff 0%, var(--paper) 45%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  .header-icons {
    display: block;
    margin: 0 auto 8px;
    height: 48px;
    width: auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .subtitle {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.85rem;
    color: #6b6458;
    margin: 0;
  }
  .progress-bar {
    margin: 16px auto 4px;
    height: 8px;
    border-radius: 6px;
    background: var(--line);
    overflow: hidden;
    max-width: 400px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done));
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-label {
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.78rem;
    color: #6b6458;
    margin-bottom: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: var(--line);
    padding: 6px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(26,35,50,0.12);
  }
  .cell {
    background: white;
    border-radius: 9px;
    padding: 8px 6px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 108px;
    transition: background 0.3s ease, transform 0.15s ease;
    position: relative;
  }
  .cell.filled {
    background: var(--done-light);
  }
  .cell.free {
    background: var(--accent-light);
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .prompt {
    font-size: 0.68rem;
    line-height: 1.25;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    color: var(--ink);
    min-height: 38px;
  }
  .free .prompt {
    font-size: 0.85rem;
    color: var(--accent-dark);
    min-height: 0;
  }
  .free input {
    border-top: 1px solid rgba(124,58,237,0.3);
    text-align: center;
  }
  .cell input {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-top: 1px solid var(--line);
    padding: 5px 2px 2px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.75rem;
    background: transparent;
    color: var(--accent-dark);
    font-weight: 600;
    outline: none;
  }
  .cell input::placeholder { color: #b8ae9c; font-weight: 400; }
  .cell.filled::after {
    content: "✓";
    position: absolute;
    top: 4px;
    right: 6px;
    color: var(--done);
    font-size: 0.8rem;
    font-weight: bold;
  }

  .panel {
    margin-top: 26px;
    background: white;
    border-radius: 12px;
    padding: 18px 18px 20px;
    box-shadow: 0 4px 16px rgba(26,35,50,0.08);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .panel label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .panel input[type="text"], .panel input[type="email"] {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 0.85rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(124,58,237,0.35);
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled {
    background: #cfc9be;
    box-shadow: none;
    cursor: not-allowed;
  }
  .hint {
    text-align: center;
    font-size: 0.72rem;
    color: #8a8171;
    margin-top: 8px;
  }
  .reset-btn {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: #a39a8a;
    font-size: 0.75rem;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .bingo-banner {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, var(--done), #059669);
    color: white;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
</style>
</head>

    <h1>Microstructure Mingle Bingo</h1>
    <p class="subtitle">Find a workshop attendee who matches each square — write their name in the box</p>
  </header>

  <div id="bingoBanner" class="bingo-banner">🎉 BINGO! Line complete — go find another!</div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <p class="progress-label" id="progressLabel">0 / 24 squares filled</p>

  <div class="grid" id="grid"></div>

  <div class="panel">
    <label for="yourName">Your name</label>
    <input type="text" id="yourName" placeholder="Your name">
    <button class="submit-btn" id="submitBtn">📧 Submit my bingo card</button>
    <p class="hint">Opens your email app with the card pre-filled — just hit send.</p>
    <button class="reset-btn" id="resetBtn">Clear all entries</button>
  </div>
</div>

<script>
const prompts = [
  "Studies white matter tractography",
  "Speaks 3+ languages",
  "Is a PhD student",
  "Works with microscopy",
  "Has a maths / physics background",
  "Is a postdoc",
  "Works on diffusion kurtosis imaging",
  "Uses machine learning in their work",
  "Has attended ESMRMB before",
  "Works with animal / preclinical models",
  "Works with ultra-high-field MRI (7T+)",
  "Is presenting a poster this workshop",
  "Has the same hobby as you outside work",
  "★ FREE SPACE ★",
  "Is a professor / group leader",
  "Studies a clinical application (cancer, stroke, etc.)",
  "Has done a postdoc abroad",
  "Works with phantoms",
  "Can explain the b-value in one sentence",
  "Is new to microstructure imaging (<1 year)",
  "Has co-authored a paper with someone else here",
  "Works on acquisition / sequence design",
  "Works on modelling / simulation",
  "Has organised a conference or workshop",
  "Loves to dance"
];

const STORAGE_KEY = "microstructureBingoEntries";
const grid = document.getElementById("grid");
let entries = Array(25).fill("");

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  if (Array.isArray(saved) && saved.length === 25) entries = saved;
} catch(e) {}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
}

// Free space (index 13) always counts as filled for line-checking, regardless of whether a name was typed in.
function isFilled(i) { return i === 13 || !!entries[i].trim(); }

function checkLines() {
  const grid5 = [];
  for (let r = 0; r < 5; r++) grid5.push([0,1,2,3,4].map(c => isFilled(r*5+c)));
  let bingo = false;
  for (let r = 0; r < 5; r++) if (grid5[r].every(Boolean)) bingo = true;
  for (let c = 0; c < 5; c++) if (grid5.every(row => row[c])) bingo = true;
  if ([0,6,12,18,24].every(isFilled)) bingo = true;
  if ([4,8,12,16,20].every(isFilled)) bingo = true;
  document.getElementById("bingoBanner").style.display = bingo ? "block" : "none";
}

function updateProgress() {
  const filled = entries.filter((v,i) => i !== 13 && v.trim()).length;
  document.getElementById("progressFill").style.width = (filled/24*100) + "%";
  document.getElementById("progressLabel").textContent = filled + " / 24 squares filled";
  checkLines();
}

function render() {
  grid.innerHTML = "";
  prompts.forEach((p, i) => {
    const cell = document.createElement("div");
    cell.className = "cell" + (i === 13 ? " free" : "");
    const promptEl = document.createElement("div");
    promptEl.className = "prompt";
    promptEl.textContent = p;
    cell.appendChild(promptEl);
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Name…";
    input.value = entries[i];
    if (entries[i].trim() && i !== 13) cell.classList.add("filled");
    input.addEventListener("input", (e) => {
      entries[i] = e.target.value;
      if (i !== 13) cell.classList.toggle("filled", !!e.target.value.trim());
      save();
      updateProgress();
    });
    cell.appendChild(input);
    grid.appendChild(cell);
  });
  updateProgress();
}
render();

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all names from the card?")) return;
  entries = Array(25).fill("");
  save();
  render();
});

document.getElementById("submitBtn").addEventListener("click", () => {
  const dest = "c.m.w.tax@umcutrecht.nl";
  const yourName = document.getElementById("yourName").value.trim() || "(name not entered)";
  const filledCount = entries.filter((v,i) => i !== 13 && v.trim()).length;
  let body = `Microstructure Mingle Bingo — submitted by ${yourName}\n`;
  body += `Squares completed: ${filledCount} / 24\n\n`;
  prompts.forEach((p, i) => {
    const done = i === 13 || entries[i].trim();
    body += `${done ? "✔" : "☐"} ${p}${entries[i].trim() ? "  —  " + entries[i].trim() : ""}\n`;
  });
  const subject = encodeURIComponent(`Bingo card — ${yourName}`);
  const mailBody = encodeURIComponent(body);
  window.location.href = `mailto:${dest}?subject=${subject}&body=${mailBody}`;
});
</script>
</body>
</html>
